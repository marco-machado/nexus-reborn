# ─── API DECISIONS ───────────────────────────────────────────────────────────

api_decisions:
  - purpose: research_apply_at_deploy
    status: active
    api: "composer runs appliedNodeIds(done, pins) at freeze; createWorld consumes roster.appliedIds"
    not: "appliedNodeIds(researchStore.done, campaignStore.pins) or unslotted∪wear inside createWorld"
    adr: docs/architecture/adr-0009-partitioned-deploy-snapshot.md
    reason: "Preserves done order; single consumption path; src/game must not read Zustand"
    referenced_by:
      - docs/architecture/adr-0009-partitioned-deploy-snapshot.md
    added: 2026-09-10
    revised: ""

  - purpose: mission_canvas
    status: active
    api: "createRoot + WebGPURenderer from three/webgpu; await init(); RenderPipeline + TSL bloom"
    not: "stock r3f <Canvas>, PostProcessing, WebGLRenderer, EffectComposer, @react-three/postprocessing"
    adr: docs/architecture/adr-0010-mission-renderer-and-frame-loop.md
    reason: "r3f#3782 races init; r181 deprecated renderAsync; r183 renamed PostProcessing; pin is r185 WebGPU"
    referenced_by:
      - docs/architecture/adr-0010-mission-renderer-and-frame-loop.md
    added: 2026-09-10
    revised: ""

  - purpose: campaign_storage
    status: active
    api: "window.localStorage + JSON via save.ts / settingsStore / telemetry.ts (three envelopes)"
    not: "zustand/middleware persist, cookies, sessionStorage, IndexedDB, OPFS"
    adr: docs/architecture/adr-0011-campaign-persistence-envelope.md
    reason: "persist middleware would durable-commit debrief in-memory apply and write at clock rate; cookies leave the machine"
    referenced_by:
      - docs/architecture/adr-0011-campaign-persistence-envelope.md
    added: 2026-09-10
    revised: ""

  - purpose: timeline_review
