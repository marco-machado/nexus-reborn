# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────

forbidden_patterns:
  - pattern: live_store_handles_into_sim
    status: active
    description: "src/game must not read researchStore, campaignStore, or worldStore for deploy inputs. No silent getState() fallback in createWorld. Do not Object.freeze() live getState() arrays — clone first."
    why: "Live handles make Abort a reload and let later lab completions or roster writes mutate a mission already on the ground."
    adr: docs/architecture/adr-0009-partitioned-deploy-snapshot.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0009-partitioned-deploy-snapshot.md
      - docs/architecture/adr-0010-mission-renderer-and-frame-loop.md
      - docs/architecture/adr-0016-tactical-sim-contract.md

  - pattern: worn_ids_on_research_slice
    status: active
    description: "Resolved worn slotted ids and appliedIds live on the Roster slice only. Research slice is completed unslotted ids only."
    why: "Wear is assignment on bodies (ADR-0005). Dual-homing ids produces two incompatible deploy DTOs."
    adr: docs/architecture/adr-0009-partitioned-deploy-snapshot.md
    added: 2026-09-10

  - pattern: quietReplay_live_restamp
    status: active
    description: "maybeOutcome, setOutcome, and reportMission must not restamp quietReplay from live contractsWon. Stamp is the Economy-slice boolean."
    why: "A live restamp makes the freeze a lie and can disagree with district rotation sampled at create."
    adr: docs/architecture/adr-0009-partitioned-deploy-snapshot.md
    added: 2026-09-10

  - pattern: stock_r3f_canvas
    status: active
    description: "Do not mount stock r3f <Canvas> or drei Canvas/View for the mission view. Use createRoot in GameCanvas.tsx."
    why: "Stock Canvas re-runs configure() on commit and races WebGPURenderer.init (r3f#3782)."
    adr: docs/architecture/adr-0010-mission-renderer-and-frame-loop.md
    added: 2026-09-10

  - pattern: per_frame_pose_in_react
    status: active
    description: "Do not put unit positions, tracers, or camera pose into React state or missionStore each frame. Scene and minimap read getWorld()."
    why: "Per-frame React reconciliation of poses is the failure mode TR-interface-004 exists to forbid."
    adr: docs/architecture/adr-0010-mission-renderer-and-frame-loop.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0010-mission-renderer-and-frame-loop.md
      - docs/architecture/adr-0016-tactical-sim-contract.md

  - pattern: extra_gpu_submit_beside_pipeline
    status: active
    description: "Effects useFrame priority 1 is the only GPU submit (RenderPipeline.render). Do not also call gl.render() / renderer.render(). A second positive-priority subscriber must not render."
    why: "r3f 9.6.1 disables auto gl.render() while any subscriber has priority>0; a second submit wipes bloom."
    adr: docs/architecture/adr-0010-mission-renderer-and-frame-loop.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0010-mission-renderer-and-frame-loop.md
      - docs/architecture/adr-0016-tactical-sim-contract.md

  - pattern: three_timer_as_game_clock
    status: active
    description: "src/ui/clock.ts, missionStore.setClock, and Opening hour are game clocks. Do not migrate them to THREE.Clock or THREE.Timer. r3f's internal Clock is frame dt only."
    why: "ADR-0001 clocks are simulation time, not the renderer timer."
    adr: docs/architecture/adr-0010-mission-renderer-and-frame-loop.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0010-mission-renderer-and-frame-loop.md
      - docs/architecture/adr-0014-timeline-review-is-a-view.md

  - pattern: live_quality_teardown
    status: active
    description: "AUTO quality step-down persists for the next mission. Do not tear the live createRoot pipeline mid-fight."
    why: "Manual r3f root makes live pipeline rebuild unsafe; Rain/bloom/DPR are mount-time."
    adr: docs/architecture/adr-0010-mission-renderer-and-frame-loop.md
    added: 2026-09-10

  - pattern: three_import_in_scene
    status: active
    description: "src/scene/ must import from three/webgpu, not from 'three'."
    why: "WebGPURenderer and TSL live on the webgpu entry as of r171; the 'three' default is the training-data trap."
    adr: docs/architecture/adr-0010-mission-renderer-and-frame-loop.md
    added: 2026-09-10

  - pattern: zustand_persist_on_campaign_stores
    status: active
    description: "Do not attach zustand/middleware persist, createJSONStorage, or persist.rehydrate() to app/world/research/campaign/tutorial. save.ts is the only campaign-blob writer."
    why: "Middleware persist would durable-commit the in-memory debrief apply and stringify on every Screen tick."
    adr: docs/architecture/adr-0011-campaign-persistence-envelope.md
    added: 2026-09-10

  - pattern: campaign_blob_half_load
    status: active
    description: "Unreadable or invalid campaign JSON is drop-all. Continue unavailable. Do not half-load. Settings/telemetry garbage falls back independently."
    why: "A half-house boots a lie: labs without a roster, or Credits without a clock."
    adr: docs/architecture/adr-0011-campaign-persistence-envelope.md
    added: 2026-09-10

  - pattern: durable_campaign_write_at_debrief
    status: active
    description: "Debrief applies once in session memory. First durable campaign write of that result is the next Screen autosave. Mission and Debrief skip the campaign blob."
    why: "A debrief checkpoint makes Abort/reload a second apply path and contradicts ADR-0002."
    adr: docs/architecture/adr-0011-campaign-persistence-envelope.md
    added: 2026-09-10

  - pattern: serialize_deploy_freeze
    status: active
    description: "Do not write ADR-0009 DeployParams / running mission into the campaign blob."
    why: "Serializing the freeze makes Abort a reload."
    adr: docs/architecture/adr-0011-campaign-persistence-envelope.md
    added: 2026-09-10

  - pattern: economyStore_module
    status: active
    description: "Do not add src/state/economyStore.ts for generated contracts or Credits. Generated instances live on worldStore; Credits stay on appStore (separate ADR)."
    why: "Splitting generated catch-up out of advanceFlow desyncs ADR-0001; owner≠Zustand home is the cut."
    adr: docs/architecture/adr-0012-store-placement.md
    added: 2026-09-10

  - pattern: second_intel_ledger
    status: active
    description: "Do not keep intelLevel/intelProgress on worldStore or appStore. Do not move them off campaignStore without superseding ADR-0012."
    why: "A second ledger dual-homes the access resource the way worn ids were dual-homed before ADR-0009."
    adr: docs/architecture/adr-0012-store-placement.md
    added: 2026-09-10

  - pattern: clamp_negative_credits_hydrate
    status: active
    description: "Do not clamp SaveV9.app.credits < 0 to 0 and continue. Invalid or non-finite credits is campaign-blob drop-all."
    why: "A repaired wallet on a half-house is the Credits face of campaign_blob_half_load."
    adr: docs/architecture/adr-0013-credits-never-overdraw.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0013-credits-never-overdraw.md

  - pattern: unguarded_credits_setState
    status: active
    description: "Production must not useAppStore.setState({ credits }) except hydrate. Debit/deposit go through spendCredits, hireOperative, addCredits, or setOutcome(+netPayout)."
    why: "Unguarded set bypasses overdraft refuse and can write a negative ledger."
    adr: docs/architecture/adr-0013-credits-never-overdraw.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0013-credits-never-overdraw.md

  - pattern: review_writes_strategic_t
    status: active
    description: "setReview must not write t, run advanceFlow, sync(t) labs/injuries, emit Tax, or reverse advanceDays. Review is a view cursor."
    why: "Writing t would make Timeline scrub a third strategic advancement path (TR-world-network-011)."
    adr: docs/architecture/adr-0014-timeline-review-is-a-view.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0014-timeline-review-is-a-view.md

  - pattern: persist_review_in_campaign_blob
    status: active
    description: "Do not add review to SaveV9.world. captureSave omits it; hydrateSave and New Operation force review: null."
    why: "Persisting the pin makes Continue open in Review and treats a view as live state (ADR-0011)."
    adr: docs/architecture/adr-0014-timeline-review-is-a-view.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0014-timeline-review-is-a-view.md

  - pattern: worldstore_review_into_gamecanvas
    status: active
    description: "Do not pass worldStore.review into GameCanvas({ review?: ReviewScene }). That prop is a DEV scene overlay (diagnostics), not the Timeline pin."
    why: "Homonym: a number pin is not ReviewScene; wiring it would type-error or overload the mission canvas."
    adr: docs/architecture/adr-0014-timeline-review-is-a-view.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0014-timeline-review-is-a-view.md

  - pattern: telemetry_network_channel
    status: active
    description: "Do not fetch, sendBeacon, open a WebSocket, or write cookies from telemetry.ts or Balance export."
    why: "TR-persistence-008 — records never leave the machine. UI SFX fetch is not a telemetry channel."
    adr: docs/architecture/adr-0015-telemetry-never-leaves-the-machine.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0015-telemetry-never-leaves-the-machine.md

  - pattern: telemetry_default_on
    status: active
    description: "settingsStore.telemetry defaults false. Do not ship the log on."
    why: "Opt-in is the TR-persistence-008 gate. On-by-default is not a preference."
    adr: docs/architecture/adr-0015-telemetry-never-leaves-the-machine.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0015-telemetry-never-leaves-the-machine.md

  - pattern: new_operation_clears_telemetry_log
    status: active
    description: "startNewOperation must not removeItem(TELEMETRY_KEY). Clear (clearRecords) is how the log dies."
    why: "New Operation erases the campaign envelope only (ADR-0011). The log is a session log across Operations."
    adr: docs/architecture/adr-0015-telemetry-never-leaves-the-machine.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0015-telemetry-never-leaves-the-machine.md

  - pattern: src_game_value_import_telemetry
    status: active
    description: "src/game must not value-import telemetry.ts or call recordMissionOutcome / recordAbort. A type-only MissionTelemetry import in world.ts is allowed."
    why: "Mission hot path keeps numeric counters and hands them once on the outcome. Persistence I/O stays in src/state/."
    adr: docs/architecture/adr-0015-telemetry-never-leaves-the-machine.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0015-telemetry-never-leaves-the-machine.md

  - pattern: physics_engine_in_tactical
    status: active
    description: "Do not add cannon, rapier, or three.js physics to the mission sim. world.ts is the custom TypeScript sim."
    why: "TR-tactical-002 — a physics addon breaks seed determinism and the no-physics pin."
    adr: docs/architecture/adr-0016-tactical-sim-contract.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0016-tactical-sim-contract.md

  - pattern: rotate_tilt_tactical_camera
    status: active
    description: "Do not add OrbitControls, MapControls, CameraControls, OrthographicCamera, or JSX PerspectiveCamera makeDefault. No rotate/tilt in play."
    why: "TR-tactical-008 — pose is CameraRig + CAMERA_YAW; minimap up must stay screen up."
    adr: docs/architecture/adr-0016-tactical-sim-contract.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0016-tactical-sim-contract.md

  - pattern: raycaster_as_fire_lane
    status: active
    description: "Fire-lane and LOS authority is strayVictim / hasLos on the walk grid. Do not use THREE.Raycaster, Mesh.raycast, or GPU picking for hits."
    why: "WebGPU mesh raycast is not the seeded sim; stray fire would disagree with the invoice count N."
    adr: docs/architecture/adr-0016-tactical-sim-contract.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0016-tactical-sim-contract.md

  - pattern: hardened_hides_minimap
    status: active
    description: "Hardened must not hide minimap cones, patrols, civilians, or objective pulse. Minimap.tsx must not read difficulty to strip Tactical data."
    why: "TR-tactical-009 — Hardened is extra patrols and confirmation, not fog-of-war."
    adr: docs/architecture/adr-0016-tactical-sim-contract.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0016-tactical-sim-contract.md

  - pattern: unify_hasLos_cityOcclusion
    status: active
    description: "Do not reuse cityOcclusion.ts (visual cutaway) as combat or path LOS. hasLos is walk-grid DDA in pathfind.ts."
    why: "Ghosting buildings is presentation; fire-lane N must match the sim grid."
    adr: docs/architecture/adr-0016-tactical-sim-contract.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0016-tactical-sim-contract.md

  - pattern: public_art_assets
    status: active
    description: "Do not add public/ art. Audio and beds load via Vite ?url from inspiration/audio/."
    why: "TR-interface-001 — screens are code-generated chrome plus the mission canvas."
    adr: docs/architecture/adr-0017-one-os-input-audio-mixer.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0017-one-os-input-audio-mixer.md

  - pattern: three_spatial_audio
    status: active
    description: "Do not use THREE.Audio, PositionalAudio, AudioListener, PannerNode, or StereoPannerNode."
    why: "TR-audio-004 — no spatial shooter mix; mixer is GainNodes under master."
    adr: docs/architecture/adr-0017-one-os-input-audio-mixer.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0017-one-os-input-audio-mixer.md

  - pattern: react_activity_for_phase
    status: active
    description: "Do not hide App.tsx phases with React 19.2 <Activity>. Route with conditionals so GameCanvas and beds unmount."
    why: "Keeping the canvas and beds alive across phase hide breaks ADR-0010 init and bed generation tokens."
    adr: docs/architecture/adr-0017-one-os-input-audio-mixer.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0017-one-os-input-audio-mixer.md

  - pattern: mission_bed_keyed_to_district
    status: active
    description: "pickMissionBedUrl is unseeded 1-of-3 at bed start. Do not key the city-hum clip to district, contract, hour, weather, or Threat."
    why: "TR-audio-002 — mission bed owns district lifetime, not a per-district soundtrack."
    adr: docs/architecture/adr-0017-one-os-input-audio-mixer.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0017-one-os-input-audio-mixer.md

  - pattern: sound_ts_typecheck_import_audio
    status: active
    description: "src/ui/sound.ts must not typecheck-import game/audio.ts. Lazy import and swallow."
    why: "TR-audio-003 — UI typecheck must not pull the mixer; late audio must not block play."
    adr: docs/architecture/adr-0017-one-os-input-audio-mixer.md
    added: 2026-09-10
    referenced_by:
      - docs/architecture/adr-0017-one-os-input-audio-mixer.md

  - pattern: bulk_rate_catchup
    status: active
    description: "Do not bulk-apply N hours of World Network effects at an ETA jump. tick and advanceDays must share advanceFlow."
    why: "TR-world-network-003 — both advancement paths are the same time-ordered catch-up; bulk rates skip per-due RNG and Feed."
    adr: docs/architecture/adr-0018-catch-up-collision-order.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0018-catch-up-collision-order.md

  - pattern: rearm_from_now
    status: active
    description: "Catch-up must rearm process timers from the due timestamp, not from now / catch-up t."
    why: "Rearming from now after a jump skips intervals that continuous ticking would have fired."
    adr: docs/architecture/adr-0018-catch-up-collision-order.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0018-catch-up-collision-order.md

  - pattern: export_collision_order_table
    status: active
    description: "Keep advanceFlow module-private. Do not export a ProcessKind enum or a public collision-order table for Research or Roster to import."
    why: "Labs complete in one sync(t); roster dues apply independently. Importing the WN table forks completion rules."
    adr: docs/architecture/adr-0018-catch-up-collision-order.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0018-catch-up-collision-order.md

  - pattern: third_t_jump_without_advanceFlow
    status: active
    description: "Do not add a third caller that jumps worldStore.t without advanceFlow. setReview must not write t."
    why: "A third jump desyncs Screen tick vs win-ETA and contradicts ADR-0001 / ADR-0014."
    adr: docs/architecture/adr-0018-catch-up-collision-order.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0018-catch-up-collision-order.md

  - pattern: mathmin_due_without_branch
    status: active
    description: "Do not add a seventh due to advanceFlow Math.min without an explicit collision-order branch. Implicit else is Tax."
    why: "A new kind without a branch is silently treated as Tax yield and reorders catch-up."
    adr: docs/architecture/adr-0018-catch-up-collision-order.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0018-catch-up-collision-order.md

  - pattern: require_four_filled_bays
    status: active
    description: "Do not refuse Deploy because a Squad bay is empty. 1–4 Ready is valid. Empty bays are a command, not a fail."
    why: "TR-roster-001 — sending fewer than four is command, not a fail."
    adr: docs/architecture/adr-0019-deploy-gate.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0019-deploy-gate.md

  - pattern: soft_cap_mass
    status: active
    description: "Squad mass over MASS_LIMIT_KG (400) refuses Deploy. Equal is allowed. massTier (light/standard/heavy) is not the gate."
    why: "TR-roster-001 — over refuses and names the overage; tier is a separate speed band."
    adr: docs/architecture/adr-0019-deploy-gate.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0019-deploy-gate.md

  - pattern: mass_limit_in_world_ts
    status: active
    description: "Do not import MASS_LIMIT_KG in world.ts. createWorld uses squadMassKg only for massTier / tierSpeedDelta."
    why: "Tactical must not re-own the 400 kg refuse. Kilogram functions stay in mass.ts."
    adr: docs/architecture/adr-0019-deploy-gate.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0019-deploy-gate.md

  - pattern: canDeploy_in_scene
    status: active
    description: "canDeploy / deployGate lives in src/game. Do not put it in src/scene. Do not start a mission with raw goto('mission')."
    why: "A scene helper or unguarded goto skips Roster's four checks."
    adr: docs/architecture/adr-0019-deploy-gate.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0019-deploy-gate.md

  - pattern: fail_completed_campaign_on_wipe
    status: active
    description: "Do not set campaignFailed when the authored spine is already complete. Empty living roster fails incomplete campaigns only."
    why: "TR-roster-007 / AC 39 — a completed campaign stays complete after a roster wipe."
    adr: docs/architecture/adr-0020-campaign-fail-flags.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0020-campaign-fail-flags.md

  - pattern: both_won_and_failed
    status: active
    description: "campaignWon and campaignFailed cannot both be true. save.ts drop-alls that blob."
    why: "TR-roster-007 — cannot be both; Persistence persist-do-not-re-own still refuses a lie."
    adr: docs/architecture/adr-0020-campaign-fail-flags.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0020-campaign-fail-flags.md

  - pattern: rederive_fail_on_hydrate
    status: active
    description: "hydrateSave must restore stored campaignWon/campaignFailed. Do not set campaignFailed from operatives.length === 0."
    why: "Re-deriving fail from empty roster false-fails a completed wipe (AC 39)."
    adr: docs/architecture/adr-0020-campaign-fail-flags.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0020-campaign-fail-flags.md

  - pattern: generated_wins_mark_complete
    status: active
    description: "Only first wins of authored MISSIONS ids join contractsWon for campaignWon. Generated wins do not mark complete."
    why: "Complete is the authored spine, not the generated market."
    adr: docs/architecture/adr-0020-campaign-fail-flags.md
    added: 2026-09-11
    referenced_by:
      - docs/architecture/adr-0020-campaign-fail-flags.md
