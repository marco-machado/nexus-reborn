    reason: "TR-world-network-011 — Review is not an advancement path"
    referenced_by:
      - docs/architecture/adr-0014-timeline-review-is-a-view.md
    added: 2026-09-10
    revised: ""

  - purpose: telemetry_storage
    status: active
    api: "window.localStorage TELEMETRY_KEY + JSON; Balance export is local data: JSON download"
    not: "fetch, sendBeacon, WebSocket, cookies, analytics SDK, IndexedDB, OPFS, zustand persist on the log"
    adr: docs/architecture/adr-0015-telemetry-never-leaves-the-machine.md
    reason: "TR-persistence-008 — records never leave the machine"
    referenced_by:
