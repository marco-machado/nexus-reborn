formulas:
  - name: injuryRecoverySec
    status: active
    source: design/gdd/roster-and-assembly.md
    referenced_by:
      - design/gdd/roster-and-assembly.md
      - design/gdd/world-network.md
      - design/gdd/persistence-and-validation.md
    variables:
      - f
    output_range: [43200, 172800]
    expression: "round(43200 + (1 - clamp(f, 0, 0.35) / 0.35) * 129600)"
    notes: "Invoke only for living survivors with f in (0, 0.35). Dead is KIA, not f=0. Canonical: docs/game-design.md §8."
    added: 2026-09-08
    revised: ""

  - name: operative_mass
    status: active
    source: design/gdd/roster-and-assembly.md
    referenced_by:
      - design/gdd/roster-and-assembly.md
    variables:
      - Wprimary
      - Wsidearm
      - H
      - m
      - c
    output_range: [0, null]
    expression: "60 + Wprimary + Wsidearm + 0.25 * max(0, H - 90) + 8m + 6c"
    notes: "No named clamp in §8. m+c ≤ 2. Unassigned bodies are not in this term. Gate is mass_gate on the squad sum. Canonical: docs/game-design.md §8."
    added: 2026-09-08
    revised: "2026-09-16"

  - name: squad_mass
    status: active
    source: design/gdd/roster-and-assembly.md
    referenced_by:
      - design/gdd/roster-and-assembly.md
    variables:
      - operative_mass
    output_range: [0, null]
    expression: "sum of operative_mass over assigned (1-4)"
    notes: "Empty bays add 0. No named clamp in §8. Gate is separate mass_gate (400 kg). 400.1 kg is legal mass that fails Deploy. Canonical: docs/game-design.md §8."
    added: 2026-09-08
    revised: "2026-09-16"

  - name: mass_gate
    status: active
    source: design/gdd/roster-and-assembly.md
    referenced_by:
      - design/gdd/roster-and-assembly.md
      - design/gdd/persistence-and-validation.md
    variables:
      - squad_mass
    output_range: [0, 1]
    expression: "squad_mass <= 400"
    notes: "Over 400 kg blocks Deploy; exactly 400 kg is allowed."
    added: 2026-09-08
    revised: ""

  - name: mass_tier
    status: active
    source: design/gdd/roster-and-assembly.md
    referenced_by:
      - design/gdd/roster-and-assembly.md
    variables:
      - squad_mass
    output_range: [-0.15, 0.15]
    expression: "+0.15 if squad_mass <= 340; -0.15 if squad_mass > 380; else 0"
    notes: "Squad-wide m/s at deploy. 380 exact is 0 (not heavy)."
    added: 2026-09-08
    revised: ""

  - name: remaining_downtime
    status: active
    source: design/gdd/roster-and-assembly.md
    referenced_by:
      - design/gdd/roster-and-assembly.md
      - design/gdd/world-network.md
    variables:
      - t0
      - D
      - t1
    output_range: [0, 172800]
    expression: "max(0, t0 + D - t1)"
    notes: "Win (including quiet replay) only. Loss spends no ETA. Recovery does not restore Squad assignment."
    added: 2026-09-08
    revised: ""

  - name: win_rate
    status: active
    source: design/gdd/persistence-and-validation.md
    referenced_by:
      - design/gdd/persistence-and-validation.md
      - design/gdd/interface.md
    variables:
      - won
      - lost
    output_range: [0, 1]
    expression: "won / (won + lost)"
    notes: "Abort excluded from denominator. Defined only when won+lost > 0; zero-denominator is Open Question 2. Canonical: docs/game-design.md §17."
    added: 2026-09-08
    revised: ""

  - name: hit_chance
    status: active
    source: design/gdd/tactical-mission.md
    referenced_by:
      - design/gdd/tactical-mission.md
    variables:
      - d
      - r
      - u
      - a
    output_range: [0.05, 0.95]
    expression: "clamp((0.78 - 0.28 * d/r + (u - 0.5) * 0.1) * a, 0.05, 0.95)"
    notes: "Valid shot 0 ≤ d ≤ r. Separate seeded draw resolves the hit. Deadeye bypasses that roll. Spread is miss path, not this roll. a: 1.0 operative / 0.45 Standard CorpSec / 0.495 Hardened. Half-range zero jitter: 0.64 / 0.288. Canonical: docs/game-design.md §10; tryFire in world.ts."
    added: 2026-09-08
    revised: ""

  - name: risk_index
    status: active
    source: design/gdd/tactical-mission.md
    referenced_by:
      - design/gdd/tactical-mission.md
      - design/gdd/world-network.md
      - design/gdd/interface.md
    variables:
      - p
      - g
      - c
      - h
      - v
    output_range: [0, null]
    expression: "round(((4p + 5g) * h + 0.5c) * (0.7 + 0.3v))"
    notes: "Tactical/Brief compute; World Network only gates intel 2+ display. Interface presents Brief bands vs Chance. Not a percentage, not capped at 100. Bands: Low <30, Guarded [30,50), High [50,75), Severe ≥75. v is clearer scripted weather (none 1.0, light 0.9, heavy 0.8), not live front, not Opening hour. Example p=8,g=7,c=22,h=1.2,v=0.9 → 89 Severe. Canonical: docs/game-design.md §5; missionRisk in forecast.ts."
    added: 2026-09-08
    revised: ""

  - name: abort_confirm_hold
    status: active
    source: design/gdd/interface.md
    referenced_by:
      - design/gdd/interface.md
    variables:
      - abort_confirm_hold
    output_range: [3, 3]
    expression: "3"
    notes: "Two-step Abort confirm hold in seconds. Armed does not discard. Canonical: docs/game-design.md §12."
    added: 2026-09-08
    revised: ""

  - name: text_scale
    status: active
    source: design/gdd/interface.md
    referenced_by:
      - design/gdd/interface.md
    variables:
      - text_scale
    output_range: [0.90, 1.25]
    expression: "∈ {0.90, 1.00, 1.10, 1.25}"
    notes: "Discrete Settings steps (90/100/110/125%). Not a continuous slider. Overflow scrolls. Canonical: docs/game-design.md §12."
    added: 2026-09-08
    revised: ""

  - name: staged_gain
    status: active
    source: design/gdd/audio.md
    referenced_by:
      - design/gdd/audio.md
    variables:
      - muted
      - master
      - channel
    output_range: [0, 1]
    expression: "0 if muted else master * channel"
    notes: "Mute zeroes every channel; unmute restores chosen levels. Authored per-bus bases sit under this factor — do not register those bases. Slider chrome scale (0-100) is not registered; audio.md records no open slider-scale choice. Canonical: docs/game-design.md §15."
    added: 2026-09-08
    revised: ""

  - name: rain_voice
    status: active
    source: design/gdd/audio.md
    referenced_by:
      - design/gdd/audio.md
    variables:
      - weather
    output_range: [0, 1]
    expression: "silent if weather = none; else matching light or heavy recording (adjacent change crossfades)"
    notes: "Follows live Weather, not Brief, not mission_bed_pick. Dry mission is silent. Canonical: docs/game-design.md §15; ADR-0006."
    added: 2026-09-08
    revised: ""

  - name: alert_tension
    status: active
    source: design/gdd/audio.md
    referenced_by:
      - design/gdd/audio.md
    variables:
      - Alert
    output_range: [0, 3]
    expression: "silent if Alert = 0 or mission ended; else synthesized drone ramped to Alert"
    notes: "Alert is Tactical (living CorpSec in Combat), not Awareness, not Threat. Do not register oscillator Hz/gain tables. Canonical: docs/game-design.md §15."
    added: 2026-09-08
    revised: ""

  - name: mission_bed_pick
    status: active
    source: design/gdd/audio.md
    referenced_by:
      - design/gdd/audio.md
    variables:
      - mission_bed_pick
    output_range: [1, 3]
    expression: "unseeded choice among 3 committed city-hum clips at mission-bed start"
    notes: "Not keyed to contract, district, Opening hour, weather, or Threat. Unseeded; does not change outcomes. Canonical: docs/game-design.md §15, §17."
    added: 2026-09-08
    revised: ""

  - name: tax_yield
    status: active
    source: design/gdd/world-network.md
    referenced_by:
      - design/gdd/world-network.md
      - design/gdd/economy-and-contracts.md
      - design/gdd/persistence-and-validation.md
      - design/gdd/tactical-mission.md
      - design/gdd/interface.md
    variables:
      - base
      - Control
      - strain
    output_range: [null, null]
    expression: "round(base × Control/100 × strain)"
    notes: "World Network computes; Economy deposits only A > 0. strain = 1 at unrest ≤ 60, else 1 − 0.02/unrest point above 60, floored 0.25. Printed for every open sector; paid only if Nexus-held. Do not claim ≥ 0 until §5 names a Control floor. Canonical: docs/game-design.md §5–6."
    added: 2026-09-22
    revised: ""

  - name: collateral
    status: active
    source: design/gdd/economy-and-contracts.md
    referenced_by:
      - design/gdd/economy-and-contracts.md
      - design/gdd/persistence-and-validation.md
      - design/gdd/tactical-mission.md
      - design/gdd/interface.md
      - design/gdd/audio.md
    variables:
      - Reward
      - civiliansHit
    output_range: [0, "Reward"]
    expression: "N = max(0, floor(civiliansHit)); collateral = min(Reward, 5000 × N)"
    notes: "Unique squad first-hits only; CorpSec hits excluded; repeats do not stack. Loss still prices this line from stored Reward and N. Canonical: docs/game-design.md §6."
    added: 2026-09-22
    revised: ""

  - name: net_payout
    status: active
    source: design/gdd/economy-and-contracts.md
    referenced_by:
      - design/gdd/economy-and-contracts.md
      - design/gdd/persistence-and-validation.md
      - design/gdd/tactical-mission.md
      - design/gdd/interface.md
      - design/gdd/audio.md
    variables:
      - won
      - quiet
      - Reward
      - completed_bonus
      - collateral
    output_range: [0, null]
    expression: "0 if quiet replay or not a Win; else Reward + max(0, completed_bonus) − collateral"
    notes: "Quiet replay pays 0 CR but stores Reward. Optional bonus collapses at max(0, completed_bonus). Canonical: docs/game-design.md §6."
    added: 2026-09-22
    revised: ""

